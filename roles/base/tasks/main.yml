---
- name: Garde-fou - versions requises (Quadlet = Podman >= 4.4, deb822_repository = ansible-core >= 2.15)
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version | int >= 13
      - ansible_version.full is version('2.15', '>=')
    fail_msg: >-
      Cible : {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }},
      ansible-core {{ ansible_version.full }}. Requis : Debian 13 (trixie) et ansible-core >= 2.15.
      Debian 12 fournit Podman 4.3 (sans Quadlet) et ansible-core 2.14. Voir README, "Prérequis".
    quiet: true

- name: Garde-fou - domaine et courriel renseignés, sans valeur d'exemple
  ansible.builtin.assert:
    that:
      - domain | default('', true) | length > 0
      - acme_email | default('', true) | length > 0
      # example.fr (valeur du dépôt) et mondomaine.fr (valeur d'exemple du README)
      - domain is not search('(^|\\.)(example|mondomaine)\\.fr$')
      - acme_email is not search('@(.*\\.)?(example|mondomaine)\\.fr$')
    fail_msg: >-
      domain ou acme_email est vide ou garde une valeur d'exemple
      (example.fr, mondomaine.fr) dans group_vars/all/main.yml.
      Les renseigner avant de déployer.
    quiet: true

- name: Garde-fou - le compte d'administration n'est pas root
  ansible.builtin.assert:
    that:
      - admin_user | default('', true) | length > 0
      - admin_user != 'root'
    fail_msg: >-
      admin_user doit être un compte ordinaire que ce playbook crée (jamais root) :
      il reçoit un mot de passe verrouillé et sshd refuse la connexion de root,
      donc la machine ne serait plus joignable. Voir README, étape 2.
    quiet: true

- name: Garde-fou - ssh_lockdown vaut true ou false
  ansible.builtin.assert:
    that:
      - ssh_lockdown is defined
      - ssh_lockdown is boolean
    fail_msg: >-
      ssh_lockdown doit valoir true ou false (group_vars/all/main.yml), sans
      guillemets. Il règle le verrouillage de SSH : voir README, étapes 9 et 10.
    quiet: true

- name: Garde-fou - clés SSH de l'administrateur
  ansible.builtin.assert:
    that:
      - admin_ssh_pubkeys | default([], true) | length > 0
      # Une clé publique complète : type, bloc base64, commentaire facultatif.
      - admin_ssh_pubkeys | default([], true) | map('string') | reject('match', '^(ssh|ecdsa|sk)-[A-Za-z0-9@.-]+ [A-Za-z0-9+/]+=*( .*)?$') | list | length == 0
    fail_msg: >-
      admin_ssh_pubkeys est vide, ou contient autre chose qu'une clé publique SSH
      complète (valeur d'exemple, chaîne vide, clé tronquée). Sans clé valable,
      la connexion par mot de passe étant interdite, la machine ne serait plus
      joignable. Voir README, étape 2.
    quiet: true

- name: Paquets à jour
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

- name: Paquets de base
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
      - nftables
      - apparmor
      - apparmor-utils
      - sudo
      - ca-certificates
      - acl                # requis par Ansible pour become_user vers un compte non privilégié
      - python3-debian     # requis par deb822_repository (dépôt CrowdSec)
      - rsyslog            # fichiers /var/log/auth.log et /var/log/haproxy.log, lus par CrowdSec
      - logrotate
    state: present

# --- Compte d'administration (AVANT de durcir SSH pour ne pas se verrouiller)
# C'est le compte que l'installateur Debian crée (README, « Les comptes ») : le
# module le configure s'il existe, le crée sinon. root n'est jamais touché.
- name: Utilisateur d'administration
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    # Mot de passe verrouillé seulement au verrouillage de SSH : jusque-là, celui
    # choisi à l'installation reste un filet de sécurité si la clé était fausse.
    password: "{{ '!' if ssh_lockdown | bool else omit }}"

- name: Clés SSH de l'administrateur
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_pubkeys | join('\n') }}"
    exclusive: true

- name: Sudo sans mot de passe pour l'admin (compte sans mot de passe)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# --- SSH
- name: Durcissement sshd
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
  notify: Vérifier et recharger sshd

- name: Rappel - SSH n'est pas encore verrouillé
  ansible.builtin.debug:
    msg: >-
      SSH n'est PAS verrouillé (ssh_lockdown: false) : le mot de passe de
      {{ admin_user }} est encore accepté. Testez la connexion par clé, puis
      passez ssh_lockdown à true et rejouez (README, étapes 9 et 10).
  when: not (ssh_lockdown | bool)

# --- Mises à jour de sécurité automatiques
- name: Activer unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

# --- Noyau
- name: Sysctl réseau et noyau
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-hardening.conf
    reload: true
  loop: "{{ base_sysctl | dict2items }}"

# --- Pare-feu hôte
- name: Règles nftables de l'hôte
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Recharger nftables

- name: Service nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Appliquer les handlers avant la suite
  ansible.builtin.meta: flush_handlers
