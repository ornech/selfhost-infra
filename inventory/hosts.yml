---
# Un seul groupe "selfhost" ; on active l'hôte cible selon la phase.
all:
  children:
    selfhost:
      hosts:
        # Phase 1 : VM Debian ARM64 sur la Freebox Delta
        freebox-vm:
          ansible_host: 192.168.1.50   # IP LAN fixe (bail DHCP statique dans Freebox OS)
          ansible_user: debian         # utilisateur créé par l'image cloud-init
