---
# ============================================================================
# Variables non secrètes. Les secrets sont dans vault.yml (chiffré).
# ============================================================================

# --- Identité ---------------------------------------------------------------
domain: example.fr                 # ton nom de domaine
acme_email: admin@example.fr       # contact Let's Encrypt
# true = autorité de TEST Let's Encrypt (certificat non reconnu par les
# navigateurs, mais pas de limite de débit). À utiliser pendant la phase VM.
acme_staging: true

# --- Administration --------------------------------------------------------
# Compte d'administration : un rôle, pas une personne (les personnes sont des
# clés dans admin_ssh_pubkeys). C'est le compte que l'installateur Debian crée ;
# le playbook le configure. Jamais root. Voir README, « Les comptes ».
admin_user: sysadmin
admin_ssh_pubkeys:
  - "ssh-ed25519 AAAA...remplace-moi admin@poste"
# Verrouillage de SSH en deux temps (README, étapes 9 et 10).
#   false : le compte et la clé sont posés, mais SSH accepte encore le mot de
#           passe : une clé fausse ne peut pas vous enfermer dehors.
#   true  : mots de passe interdits, seul admin_user peut se connecter, par clé.
# Ne passer à true qu'après avoir testé la connexion par clé (étape 9).
ssh_lockdown: false
# Réseaux d'administration : LAN + plage du VPN WireGuard.
# Servent à : SSH (nftables) et frontal privé :8443 (nftables + HAProxy).
admin_cidrs_v4:
  - 192.168.1.0/24
  - 192.168.27.64/27            # plage VPN de la Freebox : à vérifier dans Freebox OS
admin_cidrs_v6: []

# --- Certificat wildcard via DNS-01 (certbot, paquet Debian) ----------------
# Plugin certbot, paquet installé : python3-certbot-dns-<plugin>.
# Disponibles dans Debian 13 : cloudflare, desec, google, infomaniak, rfc2136,
# route53, standalone. Pas "ovh" : ce paquet n'existe pas dans Debian 13.
# Plugin testé sur Debian 13 : cloudflare.
certbot_dns_plugin: cloudflare
certbot_dns_propagation_seconds: 120

# --- CrowdSec (dépôt APT officiel, signé) -----------------------------------
# Le dépôt n'a pas toujours publié de suite "trixie" : on utilise la suite
# générique any/any de packagecloud. À repasser sur "trixie" quand elle existe.
crowdsec_apt_uri: https://packagecloud.io/crowdsec/crowdsec/any/
crowdsec_apt_suite: any
crowdsec_collections:
  - crowdsecurity/linux
  - crowdsecurity/sshd
  - crowdsecurity/haproxy
  - crowdsecurity/http-cve
  - crowdsecurity/base-http-scenarios

# --- Applications (Podman rootless, publiées sur 127.0.0.1 uniquement) -----
stack_user: stack
stack_uid: 1500
# Images épinglées PAR EMPREINTE (cf. scripts/pin-digests.sh).
# Format : registre/image:tag@sha256:<64 hex>. Le playbook refuse un tag seul.
images_require_digest: true
images:
  whoami: "docker.io/traefik/whoami:v1.10"   # remplacer par la sortie de pin-digests.sh
  ghost: "docker.io/library/ghost:6-alpine@sha256:a1c2adb3ab81b6d3fcae4d33bebe56a94a57c3e76c2f0b7b3d213726b2ca8922"
  mysql: "docker.io/library/mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902"   # Ghost n'est supporté qu'avec MySQL 8
  # Sert la page d'état (ligne stable de nginx, variante sans privilège : utilisateur 101, port 8080)
  nginx: "docker.io/nginxinc/nginx-unprivileged:1.30-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03"

# Sous-domaines publics : exposés sur 443 à tout Internet
public_hosts:
  - name: www
    image: whoami
    port: 8081            # port local 127.0.0.1:<port>
    container_port: 8080
    args: "--port 8080 --name app-publique"

  # Site du club : Ghost + MySQL 8 dans un pod (cf. README, « Application avec
  # base de données »). Secrets : club_db_password, club_db_root_password,
  # club_smtp_password, définis dans vault_app_secrets.
  - name: club
    image: ghost
    port: 8083
    container_port: 2368
    user: 1000            # utilisateur « node » : sans capacité, l'image ne peut pas basculer de root vers node
    volumes: ["club-content:/var/lib/ghost/content"]
    secrets:
      - { name: club_db_password, env: database__connection__password }
      - { name: club_smtp_password, env: mail__options__auth__pass }
    env:
      url: "https://club.{{ domain }}"
      NODE_ENV: production
      server__host: "0.0.0.0"          # dans le pod ; seul le port publié sort sur 127.0.0.1
      database__client: mysql
      database__connection__host: 127.0.0.1
      database__connection__user: ghost
      database__connection__database: ghost
      mail__transport: SMTP
      mail__from: "noreply@{{ domain }}"
      mail__options__host: smtp.mail.ovh.net
      mail__options__port: "465"
      mail__options__secure: "true"
      mail__options__auth__user: "noreply@{{ domain }}"
    sidecars:
      - name: db
        image: mysql
        add_caps: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]   # l'entrypoint MySQL change d'utilisateur
        secrets: [club_db_password, club_db_root_password]
        env:
          MYSQL_DATABASE: ghost
          MYSQL_USER: ghost
          MYSQL_PASSWORD_FILE: /run/secrets/club_db_password
          MYSQL_ROOT_PASSWORD_FILE: /run/secrets/club_db_root_password
        volumes: ["club-db:/var/lib/mysql"]

# Sous-domaines privés : servis sur :8443, accessibles UNIQUEMENT depuis
# admin_cidrs (double barrière : nftables + ACL HAProxy). Ex. : Nextcloud, supervision.
private_hosts:
  - name: whoami
    image: whoami
    port: 8082
    container_port: 8080
    args: "--port 8080 --name service-prive"

  # Page d'état (rôle status) : fichiers statiques écrits par la minuterie
  # selfhost-status, servis en lecture seule. Le volume doit être status_www.
  - name: etat
    image: nginx
    port: 8084
    container_port: 8080
    volumes: ["/srv/status/www:/usr/share/nginx/html:ro"]

# Limitation de débit HAProxy : requêtes max par IP sur 10 s. L'interface
# d'administration de Ghost charge une centaine de fichiers d'un coup.
haproxy_rate_limit: 300
