---
# Un seul groupe "selfhost" ; on active l'hôte cible selon la phase.
#
# ansible_user = compte avec lequel TU te connectes aujourd'hui. Il reste
# autorisé dans sshd (AllowUsers) à côté de admin_user : ne pas le retirer
# avant d'avoir vérifié que la connexion avec admin_user fonctionne.
all:
  children:
    selfhost:
      hosts:
        # Phase 1 : VM Debian ARM64 sur la Freebox Delta.
        # Variante A (par défaut) : Ansible lancé SUR la VM elle-même.
        freebox-vm:
          ansible_connection: local
          ansible_user: freebox
        # Variante B : Ansible lancé depuis un poste d'administration (recommandé
        # dès que possible : le mot de passe du vault ne réside plus sur le serveur).
        # freebox-vm:
        #   ansible_host: 192.168.1.50   # IP LAN fixe (bail DHCP statique dans Freebox OS)
        #   ansible_user: freebox
        #
        # Phase 2 : serveur physique
        # srv-prod:
        #   ansible_host: 10.10.20.10    # IP dans la DMZ OPNsense
        #   ansible_user: jf

    # Machine qui reçoit les sauvegardes (playbook backup-target.yml)
    backup_targets:
      hosts: {}
        # sauvegarde-distante:
        #   ansible_host: 10.8.0.2          # à travers le tunnel WireGuard
        #   ansible_user: jf
        #   backup_target_client_cidrs: [10.8.0.1/32]
