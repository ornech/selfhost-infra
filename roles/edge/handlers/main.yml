---
- name: Redémarrer rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted

- name: Recharger HAProxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: reloaded

- name: Recharger CrowdSec
  ansible.builtin.systemd_service:
    name: crowdsec
    state: reloaded
