---
stack_quadlet_files:
  - stack-egress.network
  - stack-backend.network
  - stack-sec.network
  - crowdsec.container
  - authelia.container
  - app.container
  - whoami.container
  - caddy.container

# Ordre de (re)démarrage : Caddy en dernier
stack_services: [crowdsec, authelia, app, whoami, caddy]

# Secrets DNS : DNS_API_TOKEN -> secret Podman "dns_dns_api_token", injecté en variable d'env
stack_dns_secret_names: "{{ caddy_dns_env_keys | map('lower') | map('regex_replace', '^', 'dns_') | list }}"
stack_dns_secrets: >-
  {{ dict(stack_dns_secret_names | zip(caddy_dns_env_keys | map('extract', vault_caddy_dns_env)))
     | dict2items(key_name='name', value_name='value') }}

# Tous les secrets Podman (valeurs issues du vault chiffré)
stack_secrets: >-
  {{ [
       {'name': 'crowdsec_bouncer_key', 'value': vault_crowdsec_bouncer_key},
       {'name': 'authelia_jwt_secret', 'value': vault_authelia_jwt_secret},
       {'name': 'authelia_session_secret', 'value': vault_authelia_session_secret},
       {'name': 'authelia_storage_key', 'value': vault_authelia_storage_key}
     ] + stack_dns_secrets }}
