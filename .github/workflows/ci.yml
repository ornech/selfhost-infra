name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (vault chiffré + gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Le vault doit être chiffré
        run: |
          f=group_vars/all/vault.yml
          if [ -f "$f" ] && ! head -n1 "$f" | grep -q '^\$ANSIBLE_VAULT;'; then
            echo "::error file=$f::vault.yml est en clair ! ansible-vault encrypt $f"
            exit 1
          fi
      # Binaire officiel, version épinglée, somme de contrôle vérifiée.
      # (L'action gitleaks-action échoue sur le premier push d'un dépôt.)
      - name: gitleaks (historique complet)
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks detect --source . --redact --verbose

  status-tests:
    name: Tests du relevé d'état
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Même version de Python que Debian 13 (la cible)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests (bibliothèque standard seulement)
        run: python3 -I -m unittest discover -s tests -v

  lint:
    name: Lint Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: pip install ansible-core ansible-lint yamllint
      - name: Collections
        run: ansible-galaxy collection install -r requirements.yml
      # Le vrai mot de passe vault n'est jamais donné à la CI :
      # ni syntax-check ni ansible-lint n'ont besoin de déchiffrer, un mot de passe factice suffit.
      - name: Mot de passe vault factice
        run: |
          echo dummy > "$RUNNER_TEMP/vault_pass"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/vault_pass" >> "$GITHUB_ENV"
      - name: Syntaxe
        run: ansible-playbook site.yml --syntax-check
      - name: ansible-lint
        run: ansible-lint
