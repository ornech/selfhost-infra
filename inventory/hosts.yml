---
# Un seul groupe "selfhost". L'hôte s'appelle « serveur » : c'est la machine sur
# laquelle on lance le playbook.
#
# Aucun compte n'est écrit ici pour la Variante A. Le compte d'administration
# est admin_user (group_vars/all/main.yml, « sysadmin ») ; le compte avec lequel
# Ansible se connecte ne figure plus dans la configuration de sshd.
all:
  children:
    selfhost:
      hosts:
        # Variante A (par défaut) : Ansible lancé SUR la machine elle-même.
        serveur:
          ansible_connection: local
        # Variante B (non vérifiée) : Ansible lancé depuis un poste d'administration,
        # pour que le mot de passe du vault ne réside pas sur le serveur. À activer
        # après le test SSH de l'étape 9 du README, à la place de la Variante A :
        # serveur:
        #   ansible_host: 192.168.1.50   # IP LAN fixe (bail DHCP statique dans Freebox OS)
        #   ansible_user: sysadmin

    # Machine qui reçoit les sauvegardes (playbook backup-target.yml)
    backup_targets:
      hosts: {}
        # sauvegarde-distante:
        #   ansible_host: 10.8.0.2          # à travers le tunnel WireGuard
        #   ansible_user: sysadmin
        #   backup_target_client_cidrs: [10.8.0.1/32]
