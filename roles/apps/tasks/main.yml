---
# Chaîne d'approvisionnement : une image référencée par tag peut changer sous
# nos pieds ; une empreinte sha256 non. On refuse donc les tags seuls.
- name: Toutes les images sont épinglées par empreinte
  ansible.builtin.assert:
    that: images | dict2items | rejectattr('value', 'search', '@sha256:[0-9a-f]{64}$') | list | length == 0
    fail_msg: >-
      Images non épinglées : {{ images | dict2items | rejectattr('value', 'search', '@sha256:[0-9a-f]{64}$')
      | map(attribute='key') | join(', ') }}. Lancer scripts/pin-digests.sh et reporter le résultat
      dans group_vars/all/main.yml (ou images_require_digest: false, en test seulement).
    quiet: true
  when: images_require_digest

# Sans ce contrôle, un secret absent ne se voit qu'au démarrage du conteneur
# (« no such secret », code 125), après plusieurs tentatives.
- name: Garde-fou - tous les secrets réclamés existent dans vault_app_secrets
  ansible.builtin.assert:
    that: apps_required_secrets | difference(vault_app_secrets | default({}) | list) | length == 0
    fail_msg: >-
      Secrets réclamés par les applications et absents de vault_app_secrets
      (group_vars/all/vault.yml) : {{ apps_required_secrets | difference(vault_app_secrets | default({}) | list) | join(', ') }}.
      Les ajouter sous la clé existante vault_app_secrets avec ansible-vault edit
      (README, « Application avec base de données »), ou retirer l'application
      de public_hosts / private_hosts.
    quiet: true

- name: UID de l'utilisateur des applications
  ansible.builtin.getent:
    database: passwd
    key: "{{ stack_user }}"

- name: Variables d'exécution rootless
  ansible.builtin.set_fact:
    apps_uid: "{{ ansible_facts.getent_passwd[stack_user][1] }}"
    apps_home: "{{ ansible_facts.getent_passwd[stack_user][4] }}"

- name: Déploiement rootless sous {{ stack_user }}
  become: true
  become_user: "{{ stack_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ apps_uid }}"
  block:
    - name: Arborescence
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ apps_home }}/.secrets"
        - "{{ apps_home }}/.config/containers/systemd"

    # Secret écrit d'abord dans un fichier 0600 (détection de changement),
    # puis (re)créé dans Podman uniquement s'il a changé.
    - name: Fichiers sources des secrets
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "{{ apps_home }}/.secrets/{{ item.name }}"
        mode: "0600"
      loop: "{{ apps_secrets }}"
      loop_control:
        label: "{{ item.name }}"
      register: apps_secret_files
      no_log: true

    - name: Secrets Podman
      ansible.builtin.command:
        argv: [podman, secret, create, --replace, "{{ item.item.name }}", "{{ item.dest }}"]
      loop: "{{ apps_secret_files.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.changed  # noqa: no-handler
      changed_when: true
      no_log: true

    - name: Images (par empreinte)
      containers.podman.podman_image:
        name: "{{ item }}"
      loop: "{{ apps_image_keys | map('extract', images) | list }}"

    # Application à plusieurs conteneurs : un pod (réseau commun, un seul port
    # publié) ; chaque conteneur y est rattaché par `Pod=` (cf. app.container.j2).
    - name: Unités Quadlet des pods
      ansible.builtin.template:
        src: app.pod.j2
        dest: "{{ apps_home }}/.config/containers/systemd/app-{{ item.kind }}-{{ item.name }}.pod"
        mode: "0600"
      loop: "{{ apps_units | selectattr('sidecars', 'defined') | list }}"
      loop_control:
        label: "app-{{ item.kind }}-{{ item.name }}"
      register: apps_pods

    - name: Unités Quadlet
      ansible.builtin.template:
        src: app.container.j2
        dest: "{{ apps_home }}/.config/containers/systemd/app-{{ item.kind }}-{{ item.name }}.container"
        mode: "0600"
      vars:
        ctr: "{{ item }}"
        ctr_name: "app-{{ item.kind }}-{{ item.name }}"
        ctr_desc: "Application {{ 'publique' if item.kind == 'pub' else 'privée' }} {{ item.name }}.{{ domain }}"
        ctr_pod: "{{ ('app-' ~ item.kind ~ '-' ~ item.name) if item.sidecars is defined else '' }}"
      loop: "{{ apps_units }}"
      loop_control:
        label: "app-{{ item.kind }}-{{ item.name }}"
      register: apps_quadlets

    - name: Unités Quadlet des conteneurs annexes
      ansible.builtin.template:
        src: app.container.j2
        dest: "{{ apps_home }}/.config/containers/systemd/app-{{ item.0.kind }}-{{ item.0.name }}-{{ item.1.name }}.container"
        mode: "0600"
      vars:
        ctr: "{{ item.1 }}"
        ctr_name: "app-{{ item.0.kind }}-{{ item.0.name }}-{{ item.1.name }}"
        ctr_desc: "Conteneur annexe {{ item.1.name }} de {{ item.0.name }}.{{ domain }}"
        ctr_pod: "app-{{ item.0.kind }}-{{ item.0.name }}"
      loop: "{{ apps_sidecars }}"
      loop_control:
        label: "app-{{ item.0.kind }}-{{ item.0.name }}-{{ item.1.name }}"
      register: apps_quadlets_sidecars

    - name: Générer les unités systemd à partir des fichiers Quadlet
      ansible.builtin.systemd_service:
        daemon_reload: true
        scope: user

    # Un pod déjà lancé garde son ancienne définition tant qu'il n'est pas
    # redémarré (nom, ports publiés) ; ses conteneurs sont relancés ensuite.
    - name: Redémarrer les pods dont la définition a changé
      ansible.builtin.systemd_service:
        name: "app-{{ item.item.kind }}-{{ item.item.name }}-pod.service"
        scope: user
        state: restarted
      loop: "{{ apps_pods.results | default([]) }}"
      loop_control:
        label: "app-{{ item.item.kind }}-{{ item.item.name }}-pod"
      when: item.changed  # noqa: no-handler

    # (Le pod redémarré relance lui-même ses conteneurs : systemd propage le
    # redémarrage aux unités qui en dépendent. Les redemander ici ferait
    # annuler l'un des deux jobs.)
    # Annexes d'abord : la base doit répondre avant l'application. Si elle est
    # encore en démarrage, l'application échoue puis Restart=always la relance.
    - name: Démarrer / redémarrer les conteneurs annexes
      ansible.builtin.systemd_service:
        name: "app-{{ item.item.0.kind }}-{{ item.item.0.name }}-{{ item.item.1.name }}.service"
        scope: user
        state: "{{ 'restarted' if (item.changed or apps_secret_files.changed) else 'started' }}"
      loop: "{{ apps_quadlets_sidecars.results }}"
      loop_control:
        label: "app-{{ item.item.0.kind }}-{{ item.item.0.name }}-{{ item.item.1.name }}"
      register: apps_sidecars_started
      until: apps_sidecars_started is succeeded
      retries: 3
      delay: 5

    - name: Démarrer / redémarrer les applications
      ansible.builtin.systemd_service:
        name: "app-{{ item.item.kind }}-{{ item.item.name }}.service"
        scope: user
        state: "{{ 'restarted' if (item.changed or apps_secret_files.changed) else 'started' }}"
      loop: "{{ apps_quadlets.results }}"
      loop_control:
        label: "app-{{ item.item.kind }}-{{ item.item.name }}"
      register: apps_started
      until: apps_started is succeeded
      retries: 3
      delay: 5

    # Un conteneur qui plante en boucle ne fait PAS échouer « systemctl start » :
    # il démarre, puis meurt. On laisse systemd atteindre sa limite de
    # redémarrage (le service passe alors en « failed »), puis on contrôle l'état.
    - name: Laisser aux conteneurs le temps de démarrer (ou d'échouer)
      ansible.builtin.pause:
        seconds: 15
      when: >-
        apps_quadlets.changed or apps_quadlets_sidecars.changed
        or apps_pods.changed | default(false) or apps_secret_files.changed
        or apps_started.changed or apps_sidecars_started.changed

    - name: Les applications sont actives
      ansible.builtin.command:
        argv: [systemctl, --user, is-active, "app-{{ item.kind }}-{{ item.name }}.service"]
      loop: "{{ apps_units }}"
      loop_control:
        label: "app-{{ item.kind }}-{{ item.name }}"
      register: apps_active
      changed_when: false
      failed_when: apps_active.stdout != 'active'

    - name: Les conteneurs annexes sont actifs
      ansible.builtin.command:
        argv: [systemctl, --user, is-active, "app-{{ item.0.kind }}-{{ item.0.name }}-{{ item.1.name }}.service"]
      loop: "{{ apps_sidecars }}"
      loop_control:
        label: "app-{{ item.0.kind }}-{{ item.0.name }}-{{ item.1.name }}"
      register: apps_sidecars_active
      changed_when: false
      failed_when: apps_sidecars_active.stdout != 'active'
